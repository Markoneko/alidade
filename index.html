<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alidade</title>
<meta name="description" content="Alidade : les ressources pédagogiques interactives de Marc Poupée. Teaching resources by Marc Poupée.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Cormorant+SC:wght@500;600;700&family=Karla:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Concept : une même carte, lue de jour comme un portulan, lue de nuit comme un ciel.
   Les îles deviennent des constellations ; au centre, une rose des vents fondue dans un sextant. */
:root{
  --page:#D8E1DB; --paper:#E8EEE9; --paper-2:#DCE4DE; --card:#F2F5F1; --line:#AFBDB5;
  --ink:#1B2340; --ink-2:#4A5574;
  --rh-a:#1B2340; --rh-b:#3B7A66; --rh-c:#A33240; --rh-op:.3;
  --acad:#2E3387; --acad-land:#2E3387; --acad-coast:#232968; --acad-hatch:#F4F5FB;
  --asso:#1F497D; --asso-land:#EEECE1; --asso-coast:#1F497D; --asso-hatch:#1F497D;
  --ludo:#A9501B; --ludo-land:#DD7A31; --ludo-coast:#8A3E12; --ludo-hatch:#FBEBDD;
  --brass:#9A7420; --sx-fill:#1B2340; --sx-op:.2; --sx-edge:#9A7420; --sx-edge-op:0; --sx-glow:0; --rose-op:1; --disc-op:.62;
  --star:#1B2340; --halo-op:0; --cdash:2 5; --cop:.75; --coast-dash:none; --land-op:1;
  --day:1; --night:0;
  --f-disp:"Cormorant SC","Cormorant Garamond",Garamond,"Times New Roman",serif;
  --f-ital:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --f-body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Spline Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#090F26; --paper:#0E1532; --paper-2:#161F45; --card:#131B3D; --line:#2C386A;
  --ink:#E9E3CC; --ink-2:#A1AACA;
  --rh-a:#3D4A86; --rh-b:#3D4A86; --rh-c:#3D4A86; --rh-op:.5;
  --acad:#A8ADF4; --acad-land:#2E3387; --acad-coast:#A8ADF4; --acad-hatch:#A8ADF4;
  --asso:#EEECE1; --asso-land:#EEECE1; --asso-coast:#EEECE1; --asso-hatch:#EEECE1;
  --ludo:#F3A766; --ludo-land:#DD7A31; --ludo-coast:#F3A766; --ludo-hatch:#F3A766;
  --brass:#E2BE68; --sx-fill:#03050F; --sx-op:.92; --sx-edge:#E2BE68; --sx-edge-op:.85; --sx-glow:.35; --rose-op:.5; --disc-op:0;
  --star:#FFF5D8; --halo-op:.6; --cdash:none; --cop:.85; --coast-dash:2 6; --land-op:.12;
  --day:0; --night:1; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#090F26; --paper:#0E1532; --paper-2:#161F45; --card:#131B3D; --line:#2C386A;
  --ink:#E9E3CC; --ink-2:#A1AACA;
  --rh-a:#3D4A86; --rh-b:#3D4A86; --rh-c:#3D4A86; --rh-op:.5;
  --acad:#A8ADF4; --acad-land:#2E3387; --acad-coast:#A8ADF4; --acad-hatch:#A8ADF4;
  --asso:#EEECE1; --asso-land:#EEECE1; --asso-coast:#EEECE1; --asso-hatch:#EEECE1;
  --ludo:#F3A766; --ludo-land:#DD7A31; --ludo-coast:#F3A766; --ludo-hatch:#F3A766;
  --brass:#E2BE68; --sx-fill:#03050F; --sx-op:.92; --sx-edge:#E2BE68; --sx-edge-op:.85; --sx-glow:.35; --rose-op:.5; --disc-op:0;
  --star:#FFF5D8; --halo-op:.6; --cdash:none; --cop:.85; --coast-dash:2 6; --land-op:.12;
  --day:0; --night:1; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;transition:background-color 1.2s,color 1.2s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;background:var(--card);padding:6px 10px;z-index:9}

/* Bandeau */
.mast{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding-block:22px 18px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.logo{width:52px;height:58px;flex:none}
.logo-sx{fill:var(--brass)}
.logo-disc{fill:var(--page);fill-opacity:.7;transition:fill 1.2s}
.brand h1{font-family:var(--f-disp);font-weight:600;font-size:2.5rem;line-height:.9;margin:0;letter-spacing:.06em}
.tag{margin:4px 0 0;font-family:var(--f-ital);font-style:italic;font-size:1.15rem;color:var(--ink-2);line-height:1.2}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;font:inherit;font-family:var(--f-mono);font-size:.82rem;letter-spacing:.08em;color:var(--ink-2);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sky{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px 7px 11px;cursor:pointer;
  font:inherit;font-family:var(--f-disp);font-weight:600;font-size:1.05rem;letter-spacing:.06em}
.sky svg{width:20px;height:20px}
.sky:hover,.seg:hover{border-color:var(--brass)}

/* Carte */
.frame{position:relative;border-radius:4px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(10,16,40,.45)}
#map{display:block;width:100%;height:auto;background:var(--paper);transition:background-color 1.2s}
.hint{font-family:var(--f-ital);font-style:italic;font-size:1.05rem;color:var(--ink-2);margin:10px 2px 0;max-width:80ch}

.day-only{opacity:var(--day);transition:opacity 1.2s ease}
.night-only{opacity:var(--night);transition:opacity 1.2s ease}
.sea{fill:var(--paper);transition:fill 1.2s}
.rh{stroke-width:1;opacity:var(--rh-op);transition:stroke 1.2s,opacity 1.2s}
.rh-a{stroke:var(--rh-a)}.rh-b{stroke:var(--rh-b)}.rh-c{stroke:var(--rh-c)}
.rcircle{fill:none;stroke:var(--ink-2);stroke-width:.8;stroke-dasharray:2 6;opacity:.45}
.rnode{fill:var(--paper);stroke:var(--ink-2);stroke-width:.8}
.sound{font-family:var(--f-ital);font-style:italic;font-size:12px;fill:var(--ink-2)}
.sf{fill:var(--star)}
.tw{animation:tw 3.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.g-acad{--c:var(--acad);--land:var(--acad-land);--coastc:var(--acad-coast);--hatchc:var(--acad-hatch)}
.g-asso{--c:var(--asso);--land:var(--asso-land);--coastc:var(--asso-coast);--hatchc:var(--asso-hatch)}
.g-ludo{--c:var(--ludo);--land:var(--ludo-land);--coastc:var(--ludo-coast);--hatchc:var(--ludo-hatch)}
.land{fill:var(--land);opacity:calc(.94 * var(--land-op) + .1 * var(--night));transition:opacity 1.2s}
.hatch{opacity:calc(.3 * var(--land-op));transition:opacity 1.2s}
.hl{stroke:var(--hatchc);stroke-width:1.1}
.coast-halo{fill:none;stroke:var(--coastc);opacity:.16;stroke-linejoin:round}
.coast{fill:none;stroke:var(--coastc);stroke-width:1.3;stroke-dasharray:var(--coast-dash);stroke-linejoin:round;transition:stroke 1.2s}
.cline{fill:none;stroke:var(--c);stroke-width:1.4;stroke-dasharray:var(--cdash);opacity:var(--cop);stroke-linecap:round}
.st{cursor:pointer;outline:none}
.st .halo{fill:var(--c);opacity:var(--halo-op);filter:url(#blur);transition:opacity 1.2s}
.st .ring{fill:var(--paper);stroke:var(--c);stroke-width:1.6}
.st .s4{fill:var(--star);transition:fill 1.2s}
.st .hit{fill:transparent}
.st .core{transition:transform .25s ease;transform-box:fill-box;transform-origin:center}
.st:hover .core,.st:focus-visible .core,.st.on .core{transform:scale(1.45)}
/* Escale publiée : l'amer palpite (jour et nuit) */
.st .ping{fill:none;stroke:var(--c);stroke-width:1.4;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.st.pub .ping{animation:ping 3s ease-out infinite}
.st.pub .ping.p2{animation-delay:1.5s}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.7);opacity:0}}
.st .beat{transform-box:fill-box;transform-origin:center}
.st.pub .beat{animation:beat 3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.16)}22%{transform:scale(1)}}
.st.pub .halo{opacity:calc(var(--halo-op) + .28)}
.st.pub .ring{stroke-width:2.2}
.st:focus-visible .ring{stroke:var(--brass);stroke-width:2.5}
.minor{fill:var(--star);opacity:.75}
.iname{font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.32em;fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.slabel{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.04em;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;pointer-events:none;transition:fill 1.2s}
.alab{font-family:var(--f-ital);font-style:italic;font-weight:600;font-size:27px;fill:var(--c);paint-order:stroke;stroke:var(--paper);stroke-width:5px}
.asub{font-family:var(--f-disp);font-size:13px;letter-spacing:.14em;fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.em-bg{fill:var(--paper);transition:fill 1.2s}
.em-ring{fill:none;stroke:var(--ink);stroke-width:1.2}
.tick{stroke:var(--ink);stroke-width:1}
.deg{font-family:var(--f-mono);font-size:9.5px;fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px}
.card-n{font-family:var(--f-disp);font-weight:700;font-size:17px;fill:var(--ink)}
.rose-d{fill:var(--ink);transition:fill 1.2s}
.rose-l{fill:var(--paper);stroke:var(--ink);stroke-width:.9;transition:fill 1.2s}
.hub{fill:var(--brass);stroke:var(--ink);stroke-width:1}
.sx{transition:transform 1.1s cubic-bezier(.3,.7,.2,1);pointer-events:none}
.sx-body{fill:var(--sx-fill);opacity:var(--sx-op);stroke:var(--sx-edge);stroke-width:1;vector-effect:non-scaling-stroke;stroke-opacity:var(--sx-edge-op);transition:fill 1.2s,opacity 1.2s,stroke-opacity 1.2s}
.sx-glow{fill:none;stroke:var(--brass);stroke-width:5;vector-effect:non-scaling-stroke;opacity:var(--sx-glow);filter:url(#sxglow);transition:opacity 1.2s}
.rose{opacity:var(--rose-op);transition:opacity 1.2s}
.em-bg{fill-opacity:var(--disc-op)}
.sight{stroke:var(--brass);stroke-width:1.6;stroke-dasharray:3 5;stroke-linecap:round;opacity:0;transition:opacity .3s;pointer-events:none}
.sight.on{opacity:.9}
.readout{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;fill:var(--ink)}
.readout2{font-family:var(--f-ital);font-style:italic;font-size:19px;fill:var(--ink-2)}
.cart{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.cart2{fill:none;stroke:var(--ink);stroke-width:.6}
.ct1{font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:.12em;fill:var(--ink)}
.ct2{font-family:var(--f-ital);font-style:italic;font-size:17px;fill:var(--ink-2)}
.scale-a{fill:var(--ink)}.scale-b{fill:var(--paper);stroke:var(--ink);stroke-width:.8}
.scale-n{font-family:var(--f-mono);font-size:9.5px;fill:var(--ink-2)}
.bord{fill:none;stroke:var(--ink);stroke-width:1}
.bseg{fill:var(--ink)}

/* Fiche d'escale */
.card{position:absolute;z-index:3;width:min(330px,calc(100% - 24px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:14px 16px 13px;
  box-shadow:0 14px 30px -18px rgba(8,12,30,.55);transition:opacity .2s}
.c-eye{margin:0;font-family:var(--f-disp);font-weight:600;font-size:.86rem;letter-spacing:.12em;color:var(--c)}
.card h3{margin:2px 0 6px;font-family:var(--f-ital);font-style:italic;font-weight:600;font-size:1.55rem;line-height:1.1;text-wrap:balance}
.c-desc{margin:0 0 10px;font-size:.95rem}
.card dl{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.86rem}
.card dl div{display:contents}
.card dt{color:var(--ink-2)}.card dd{margin:0}
.c-star{margin:0 0 4px;font-size:.88rem;color:var(--ink-2)}.c-star b{color:var(--ink);font-weight:700}
.c-pos{margin:0 0 10px;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2);letter-spacing:.02em}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--brass);color:var(--brass);border-radius:3px;padding:2px 7px;white-space:nowrap}
.pill.publie{border-style:solid;color:var(--acad);border-color:var(--acad)}
.go{font-family:var(--f-disp);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-decoration:none;border-bottom:1.5px solid var(--brass)}
.go:hover{color:var(--brass)}

/* À propos + légende */
.about{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;margin:40px 0 8px;align-items:start}
@media (max-width:820px){.about{grid-template-columns:minmax(0,1fr)}}
.about p.lead{margin:0;font-family:var(--f-ital);font-style:italic;font-size:1.45rem;line-height:1.35;max-width:46ch;text-wrap:pretty}
.legend{border-top:1px solid var(--ink);padding-top:10px;font-size:.92rem}
.legend h2{margin:0 0 6px;font-family:var(--f-disp);font-weight:600;font-size:1rem;letter-spacing:.14em}
.legend ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legend li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}
.legend svg{width:28px;height:18px}

/* Registre */
.register{margin-top:44px}
.register>h2{font-family:var(--f-disp);font-weight:600;font-size:1.9rem;letter-spacing:.08em;margin:0 0 4px}
.register>p{margin:0 0 18px;color:var(--ink-2);font-family:var(--f-ital);font-style:italic;font-size:1.1rem}
.grp{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);gap:8px 28px;padding:18px 0;border-top:2px solid var(--ink)}
@media (max-width:760px){.grp{grid-template-columns:minmax(0,1fr)}}
.grp header{display:flex;gap:10px;align-items:flex-start}
.gmark{width:22px;height:22px;flex:none;margin-top:4px}
.gmark path{fill:var(--c)}
.grp h3{margin:0;font-family:var(--f-ital);font-style:italic;font-weight:600;font-size:1.5rem;line-height:1.1;color:var(--c)}
.grp header p.gsky{font-family:var(--f-ital);font-style:italic;font-size:1rem;letter-spacing:0;margin-top:4px}
.grp header p{margin:2px 0 0;font-family:var(--f-disp);font-size:.9rem;letter-spacing:.1em;color:var(--ink-2)}
.grp ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:11px 4px;border-bottom:1px solid var(--line);text-decoration:none;align-items:baseline;transition:background-color .2s}
.row:hover,.row:focus-visible{background:var(--paper-2)}
.r-t{font-family:var(--f-disp);font-weight:600;font-size:1.2rem;letter-spacing:.03em;line-height:1.2}
.r-d{grid-column:1;font-size:.95rem;color:var(--ink);max-width:70ch}
.r-m{grid-column:1;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2)}
.row .pill{grid-column:2;grid-row:1}
.foot{margin-top:46px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:.86rem;color:var(--ink-2)}
.foot p{margin:0;max-width:70ch}
.sig{font-family:var(--f-ital);font-style:italic;font-size:1.15rem;color:var(--ink)}

@media (max-width:640px){
  .brand h1{font-size:2rem}.logo{width:44px;height:49px}
  .slabel{display:none}
  .about p.lead{font-size:1.25rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<a class="skip" href="#registre" id="skip">Registre</a>
<div class="wrap">
  <header class="mast">
    <a class="brand" href="./" aria-label="Alidade">
      <svg class="logo" viewBox="-50 -48 100 112" aria-hidden="true">
        <path class="logo-sx" transform="scale(.112) translate(-374 -182)" d=""/>
        <circle class="logo-disc" r="33"/>
        <circle r="33" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <path d="M0 -29 L4.6 0 L0 29 L-4.6 0Z M-29 0 L0 -4.6 L29 0 L0 4.6Z" fill="currentColor"/>
        <circle r="3.6" fill="var(--brass)" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <div><h1>Alidade</h1><p class="tag" data-i18n="tagline"></p></div>
    </a>
    <div class="controls">
      <div class="seg" role="group" aria-label="Langue · Language">
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="sky" id="sky"><svg id="skyI" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="skyT"></span></button>
    </div>
  </header>

  <main>
    <section aria-labelledby="chartT">
      <h2 class="vh" id="chartT" data-i18n="chartTitle"></h2>
      <div class="frame" id="frame">
        <svg id="map" viewBox="0 0 1200 800" role="group" aria-labelledby="chartT"></svg>
        <div class="card" id="card" hidden></div>
      </div>
      <p class="hint" data-i18n="hint"></p>
    </section>

    <section class="about">
      <p class="lead" data-i18n="about"></p>
      <div class="legend">
        <h2 data-i18n="legendT"></h2>
        <ul>
          <li><svg viewBox="-14 -9 28 18" aria-hidden="true"><circle r="7" fill="var(--paper)" stroke="var(--asso)" stroke-width="1.5"/><path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5Z" fill="var(--star)"/></svg><span data-i18n="lg1"></span></li>
          <li><svg viewBox="0 0 28 18" aria-hidden="true"><path d="M2 9 H26" stroke="var(--ludo)" stroke-width="1.6" stroke-dasharray="2 4" stroke-linecap="round"/></svg><span data-i18n="lg2"></span></li>
          <li><svg viewBox="-14 -9 28 18" aria-hidden="true"><path d="M-12 -5 L-4 -1 L1 -4 L7 1 L12 -3" fill="none" stroke="var(--acad)" stroke-width="1.3"/><circle cx="-12" cy="-5" r="1.6" fill="var(--star)"/><circle cx="-4" cy="-1" r="1.6" fill="var(--star)"/><circle cx="1" cy="-4" r="1.6" fill="var(--star)"/><circle cx="7" cy="1" r="1.6" fill="var(--star)"/><circle cx="12" cy="-3" r="1.6" fill="var(--star)"/></svg><span data-i18n="lg4"></span></li>
          <li><svg viewBox="-14 -9 28 18" aria-hidden="true"><circle r="8" fill="none" stroke="var(--acad)" stroke-width="1" opacity=".45"/><circle r="5.5" fill="var(--paper)" stroke="var(--acad)" stroke-width="1.8"/><path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1Z" fill="var(--star)"/></svg><span data-i18n="lg5"></span></li>
          <li><svg viewBox="0 0 28 18" aria-hidden="true"><path d="M4 15 A14 14 0 0 1 24 15" fill="none" stroke="var(--brass)" stroke-width="4"/><path d="M14 16 L18 3" stroke="var(--ink)" stroke-width="2"/></svg><span data-i18n="lg3"></span></li>
        </ul>
      </div>
    </section>

    <section class="register" id="registre" aria-labelledby="regT">
      <h2 id="regT" data-i18n="register"></h2>
      <p data-i18n="registerSub"></p>
      <div id="groups"></div>

  el("textPath",{href:up?"#degUp":"#degLo",startOffset:((up?((d-275+360)%360):(265-d))/170*100).toFixed(2)+"%","text-anchor":"middle"},tx,String(d).padStart(3,"0"));}
 const point=(ang,len,w,parent)=>{const th=(ang-90)*Math.PI/180,px=Math.cos(th),py=Math.sin(th),qx=-py,qy=px;
  const tip=`${(px*len).toFixed(1)} ${(py*len).toFixed(1)}`, l=`${(qx*w).toFixed(1)} ${(qy*w).toFixed(1)}`, r=`${(-qx*w).toFixed(1)} ${(-qy*w).toFixed(1)}`;
  el("path",{class:"rose-l",d:`M0 0 L${l} L${tip}Z`},parent); el("path",{class:"rose-d",d:`M0 0 L${r} L${tip}Z`},parent);};
 for(let i=0;i<16;i++){if(i%2)point(i*22.5,46,5,R);}
 for(let i=0;i<8;i++){if(i%2)point(i*45,72,10,R);}
 for(let i=0;i<4;i++)point(i*90,104,13,R);
 el("circle",{class:"hub",r:"6"},R);
 [["N",0],["E",90],["S",180],["O",270]].forEach(([n,a])=>{const th=(a-90)*Math.PI/180;
  el("text",{class:"card-n",x:(Math.cos(th)*146).toFixed(1),y:(Math.sin(th)*146+6).toFixed(1),"text-anchor":"middle"},E,lang==="en"&&n==="O"?"W":n);});

 /* Cartouche */
 const K=el("g",{"aria-hidden":"true"},svg);
 el("rect",{class:"cart",x:"446",y:"30",width:"308",height:"90",rx:"2"},K);
 el("rect",{class:"cart2",x:"452",y:"36",width:"296",height:"78"},K);
 el("text",{class:"ct1",x:"600",y:"62","text-anchor":"middle"},K,t("cart1"));
 el("text",{class:"ct2",x:"600",y:"84","text-anchor":"middle"},K,t("cart2"));
 for(let i=0;i<5;i++)el("rect",{class:i%2?"scale-b":"scale-a",x:String(530+i*28),y:"93",width:"28",height:"5"},K);
 for(let i=0;i<=5;i++)el("text",{class:"scale-n",x:String(530+i*28),y:"108","text-anchor":"middle"},K,i===5?"5 h":String(i));

 sightEl=el("line",{class:"sight",x1:CX,y1:CY,x2:CX,y2:CY},svg);

 /* Archipels */
 for(const g of ARCH){
  const G=el("g",{class:"g-"+g.a.hue},svg);
  for(const i of g.islands){
   const d=g.real?poly(i.pts):smooth(i.pts), small=Math.max(i.bbox.x1-i.bbox.x0,i.bbox.y1-i.bbox.y0)<24;
   el("path",{class:"coast-halo",d,"stroke-width":small?"4":"7"},G); el("path",{class:"land",d},G);
   if(!small)el("path",{class:"hatch",d,fill:`url(#h-${g.a.hue})`},G);
   el("path",{class:"coast",d},G);
  }
  el("path",{class:"cline",d:g.lines.map(([p,q])=>`M${p.x.toFixed(1)} ${p.y.toFixed(1)}L${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join("")},G);
  for(const m of g.minors){const mi=el("path",{class:"minor",d:STAR4,transform:`translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) scale(.42)`},G);
   if(m.island.name)el("title",{},mi,m.island.name);}
  const [lx,ly]=g.lab;
  if(g.geo)el("text",{class:"iname",x:lx.toFixed(0),y:ly.toFixed(0),"text-anchor":"middle"},G,L(g.geo.name).toUpperCase());
  el("text",{class:"alab",x:lx.toFixed(0),y:(ly+28).toFixed(0),"text-anchor":"middle"},G,L(g.a.name));
  el("text",{class:"asub",x:lx.toFixed(0),y:(ly+48).toFixed(0),"text-anchor":"middle"},G,L(g.a.sub).toUpperCase());
  for(const s of g.stars){
   const k=s.extra?.82:1;
   const A=el("a",{class:"st"+(s.res.status==="publie"?" pub":""),href:escaleHref(s.res),"data-id":s.res.id,"aria-label":`${L(s.res.title)} · ${t(s.res.status)}`,transform:`translate(${s.x.toFixed(1)} ${s.y.toFixed(1)})`},G);
   el("circle",{class:"hit",r:"18"},A);
   if(s.res.status==="publie"){el("circle",{class:"ping",r:(10*k).toFixed(1)},A);el("circle",{class:"ping p2",r:(10*k).toFixed(1)},A);}
   const C=el("g",{class:"core"},A), B=el("g",{class:"beat"},C);
   el("circle",{class:"halo",r:(14*k).toFixed(1)},B); el("circle",{class:"ring day-only",r:(9.5*k).toFixed(1)},B); el("path",{class:"s4",d:STAR4,transform:`scale(${k})`},B);
   const lbl=s.lbl, sd=s.side;
   el("text",{class:"slabel",x:(s.x+(sd==="r"?15:sd==="l"?-15:0)).toFixed(1),y:(s.y+(sd==="t"?-17:sd==="b"?27:5)).toFixed(1),"text-anchor":sd==="r"?"start":sd==="l"?"end":"middle"},G,lbl);
  }
 }

 readEl=el("text",{class:"readout",x:CX,y:String(CY+252),"text-anchor":"middle"},svg,t("readIdle"));
 read2El=el("text",{class:"readout2",x:CX,y:String(CY+276),"text-anchor":"middle"},svg,"");

 /* Bordure graduée */
 const B=el("g",{"aria-hidden":"true"},svg);
 el("rect",{class:"bord",x:"8",y:"8",width:String(W-16),height:String(H-16)},B);
 el("rect",{class:"bord",x:"16",y:"16",width:String(W-32),height:String(H-32)},B);
 for(let x=16,i=0;x<W-16;x+=40,i++){if(i%2===0){el("rect",{class:"bseg",x:String(x),y:"8",width:String(Math.min(40,W-16-x)),height:"8"},B);el("rect",{class:"bseg",x:String(x),y:String(H-16),width:String(Math.min(40,W-16-x)),height:"8"},B);}}
 for(let y=16,i=0;y<H-16;y+=40,i++){if(i%2===0){el("rect",{class:"bseg",x:"8",y:String(y),width:"8",height:String(Math.min(40,H-16-y))},B);el("rect",{class:"bseg",x:String(W-16),y:String(y),width:"8",height:String(Math.min(40,H-16-y))},B);}}

 sxApply();
 bindStars();
}

/* Visée */
/* Le sextant tourne sur sa rotule et se retourne pour viser à l'est ; l'axe de sa lunette, prolongé au-delà du petit miroir, passe exactement par l'escale */
function sxApply(){sxEl.style.transform=`rotate(${sxAngle}deg) scaleX(${sxMirror})`;}
const allStars=()=>ARCH.flatMap(g=>g.stars);
const starById=id=>allStars().find(s=>s.res.id===id);
const bearing=s=>(Math.round(Math.atan2(s.x-CX,-(s.y-CY))*180/Math.PI)+360)%360;
function aim(s){
 const S=SEXTANT,k=S.scale,a=(S.axisY-S.pivot[1])*k,dx=s.x-CX,dy=s.y-CY,dd=Math.hypot(dx,dy)||1;
 const b=bearing(s); sxMirror=(b>0&&b<180)?-1:1;
 const phi=Math.atan2(dy,dx)*180/Math.PI, off=Math.asin(clamp(a/dd,-1,1))*180/Math.PI;
 const target=sxMirror===1?phi-180+off:phi-off;
 let delta=((target-sxAngle)%360+540)%360-180; sxAngle+=delta; sxApply();
 const th=target*Math.PI/180,lx=sxMirror*(S.mirrorX-S.pivot[0])*k,x1=CX+lx*Math.cos(th)-a*Math.sin(th),y1=CY+lx*Math.sin(th)+a*Math.cos(th);
 const ux=s.x-x1,uy=s.y-y1,ul=Math.hypot(ux,uy)||1;
 sightEl.setAttribute("x1",x1.toFixed(1));sightEl.setAttribute("y1",y1.toFixed(1));
 sightEl.setAttribute("x2",(s.x-ux/ul*14).toFixed(1));sightEl.setAttribute("y2",(s.y-uy/ul*14).toFixed(1));sightEl.classList.add("on");
 readEl.textContent=`${t("bearing").toUpperCase()} ${String(bearing(s)).padStart(3,"0")}°`;
 read2El.textContent=L(s.res.title)+(s.island&&s.island.name?` · ${s.island.name}`:"");
 document.querySelectorAll(".st").forEach(n=>n.classList.toggle("on",n.dataset.id===s.res.id));
}
function rest(){sightEl.classList.remove("on");readEl.textContent=t("readIdle");read2El.textContent="";document.querySelectorAll(".st.on").forEach(n=>n.classList.remove("on"));}
function pos(s){const g=ARCH.find(q=>q.stars.includes(s));const ll=g&&g.lonlat?g.lonlat(s.x,s.y):[50-s.y/H*11,-6+s.x/W*15].reverse();const lat=ll[1],lon=ll[0];
 const f=(v,p,n)=>{const tm=Math.round(Math.abs(v)*60),d=Math.floor(tm/60),m=tm%60;return `${d}°${String(m).padStart(2,"0")}′ ${v>=0?p:n}`;};
 return `${f(lat,"N","S")} · ${f(lon,"E",lang==="en"?"W":"O")}`;}
const escaleHref=r=>"escale.html#"+encodeURIComponent(r.id);
const langsTxt=r=>(r.langs||["fr"]).map(x=>x.toUpperCase()).join(" · ");

let cardFor=null, hideT=null;
function showCard(s){
 clearTimeout(hideT); cardFor=s.res.id;
 const r=s.res, a=archById[r.arch], c=$("#card");
 c.style.setProperty("--c",`var(--${a.hue})`);
 c.innerHTML=`<p class="c-eye">${L(a.name)}</p><h3>${L(r.title)}</h3><p class="c-desc">${L(r.desc)}</p>
  <dl><div><dt>${t("public")}</dt><dd>${L(r.audience)}</dd></div><div><dt>${t("duration")}</dt><dd>${L(r.duration)}</dd></div><div><dt>${t("langs")}</dt><dd>${langsTxt(r)}</dd></div></dl>
  ${s.island&&s.island.name?`<p class="c-star">${t("island")} <b>${s.island.name}</b> · ${L(GEO[a.geo].name)}</p>`:""}
  <p class="c-pos">${t("position")} ${pos(s)} · ${t("bearing")} ${String(bearing(s)).padStart(3,"0")}°</p>
  <div class="c-foot"><span class="pill ${r.status}">${t(r.status)}</span><a class="go" href="${escaleHref(r)}">${t("go")} →</a></div>`;
 c.hidden=false;
 const fr=$("#frame").getBoundingClientRect(), k=fr.width/W, cw=c.offsetWidth, ch=c.offsetHeight;
 let x=s.x*k, y=s.y*k;
 let left=x+(x<fr.width*.55?26:-26-cw); left=clamp(left,12,fr.width-cw-12);
 let top=clamp(y-ch/2,12,Math.max(12,fr.height-ch-12));
 c.style.left=left+"px"; c.style.top=top+"px";
}
function hideCard(delay){clearTimeout(hideT);hideT=setTimeout(()=>{$("#card").hidden=true;cardFor=null;rest();},delay||0);}
function bindStars(){
 document.querySelectorAll(".st").forEach(n=>{
  const s=starById(n.dataset.id);
  n.addEventListener("mouseenter",()=>{aim(s);showCard(s);});
  n.addEventListener("mouseleave",()=>hideCard(260));
  n.addEventListener("focus",()=>{aim(s);showCard(s);});
  n.addEventListener("blur",()=>hideCard(400));
  n.addEventListener("click",ev=>{if(touch&&cardFor!==s.res.id){ev.preventDefault();aim(s);showCard(s);}});
 });
}
const card=$("#card");
card.addEventListener("mouseenter",()=>clearTimeout(hideT));
card.addEventListener("mouseleave",()=>hideCard(260));
card.addEventListener("focusin",()=>clearTimeout(hideT));
card.addEventListener("focusout",()=>hideCard(400));
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideCard(0);});
document.addEventListener("click",e=>{if(touch&&!e.target.closest(".st")&&!e.target.closest("#card"))hideCard(0);});

/* Registre */
function buildRegister(){
 $("#groups").innerHTML=ARCH.map(g=>`<section class="grp g-${g.a.hue}" aria-label="${L(g.a.name)}">
  <header><svg class="gmark" viewBox="-10 -10 20 20" aria-hidden="true"><path d="${STAR4}"/></svg><div><h3>${L(g.a.name)}</h3><p>${L(g.a.sub)}</p>${g.geo?`<p class="gsky">${L(g.geo.name)} · ${L(g.geo.where)}</p>`:""}</div></header>
  <ul>${g.res.map(r=>`<li><a class="row" href="${escaleHref(r)}" data-id="${r.id}"><span class="r-t">${L(r.title)}</span><span class="r-d">${L(r.desc)}</span><span class="r-m">${L(r.audience)} · ${L(r.duration)} · ${langsTxt(r)}</span><span class="pill ${r.status}">${t(r.status)}</span></a></li>`).join("")}</ul></section>`).join("");
 document.querySelectorAll(".row").forEach(a=>{const s=starById(a.dataset.id);
  a.addEventListener("mouseenter",()=>aim(s)); a.addEventListener("focus",()=>aim(s));
  a.addEventListener("mouseleave",rest); a.addEventListener("blur",rest);});
}

/* Textes, langue, jour/nuit */
function applyText(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i18n]").forEach(n=>{n.textContent=t(n.dataset.i18n);});
 if(touch) document.querySelector('[data-i18n="hint"]').textContent=t("hintTouch");
 $("#skip").textContent=t("skip");
 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
 updateSky();
}
function updateSky(){
 const night=isNight();
 $("#skyT").textContent=night?t("readChart"):t("readSky");
 $("#skyI").innerHTML=night
  ?'<circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5 L14 12 L12 20.5 L10 12Z" fill="currentColor"/>'
  :'<path d="M15.5 3.2A9 9 0 1 0 20.8 15 7.2 7.2 0 0 1 15.5 3.2Z" fill="currentColor"/><circle cx="19" cy="5" r="1" fill="currentColor"/>';
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;store.set("alidade-lang",lang);hideCard(0);applyText();build();buildRegister();}));
$("#sky").addEventListener("click",()=>{const next=isNight()?"light":"dark";document.documentElement.setAttribute("data-theme",next);store.set("alidade-theme",next);updateSky();});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",updateSky);
window.addEventListener("resize",()=>hideCard(0));

applyText(); build(); buildRegister();
})();
</script>
</body>
</html>
